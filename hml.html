<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memories 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ffe4ec, #ffd6e0, #ffffff);
  overflow-x: hidden;
}

.section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 80px 10%;
  opacity: 0;
  transform: translateY(80px) scale(0.95);
  transition: all 1s ease;
}

.section.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.section:nth-child(even) {
  flex-direction: row-reverse;
}

img {
  width: 40%;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transition: 0.5s;
}

img:hover {
  transform: scale(1.05);
}

.text {
  width: 50%;
  font-size: 1.2rem;
  color: #5a2a3a;
}

h2 {
  font-family: 'Great Vibes', cursive;
  font-size: 2.5rem;
  color: #ff2e63;
}

.button-container {
  text-align: center;
  padding: 60px 20px;
}

button {
  padding: 15px 30px;
  font-size: 1.2rem;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff6a88, #ff99ac);
  color: white;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255,105,135,0.6);
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

@media(max-width: 768px) {
  .section {
    flex-direction: column !important;
    text-align: center;
  }

  img, .text {
    width: 100%;
  }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="Stephen Sanchez - Until I Found You (Official Video).mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

// Try autoplay (works on some browsers)
music.play().catch(() => {
  console.log("Autoplay blocked");
});

// Force play on ANY user interaction
document.addEventListener("click", () => {
  music.play();
}, { once: true });

document.addEventListener("touchstart", () => {
  music.play();
}, { once: true });
</script>

<!-- 10 Sections -->

<script>
const descriptions = [
  "Every moment with you feels like magic ✨",
  "Your smile is my favorite view 😊",
  "You make my world brighter every day ☀️",
  "With you, everything feels perfect 💖",
  "You are my peace in chaos 🌸",
  "Your eyes tell the sweetest stories 👀",
  "You are my dream come true 💫",
  "Every second with you is precious ⏳",
  "You complete me ❤️",
  "Forever with you is all I want 💍"
];

for (let i = 1; i <= 10; i++) {
  const section = document.createElement('div');
  section.className = 'section';

  section.innerHTML = `
    <img src="IMAGE_${i}.jpg" alt="memory">
    <div class="text">
      <h2>Memory ${i}</h2>
      <p>${descriptions[i-1]}</p>
    </div>
  `;

  document.body.appendChild(section);
}

// Button
const btnDiv = document.createElement('div');
btnDiv.className = 'button-container';
btnDiv.innerHTML = `<button onclick="goNext()">Click to see me ❤️</button>`;
document.body.appendChild(btnDiv);

function goNext() {
  window.location.href = "mtu.html";
}

// Scroll animation
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
    }
  });
});

setTimeout(() => {
  document.querySelectorAll('.section').forEach(sec => {
    observer.observe(sec);
  });
}, 500);
</script>

</body>
</html>
